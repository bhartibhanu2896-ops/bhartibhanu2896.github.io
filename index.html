<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Society Services Catalog</title>
  <link rel="stylesheet" href="/assets/styles.css">
</head>
<body>
  <header class="site-header">
    <div class="container">
      <h1>Society Services Catalog</h1>
      <p class="tagline">Find trusted services for our community — verified vendors and member reviews.</p>
    </div>
  </header>

  <main class="container">
    <section class="controls">
      <input id="search" type="search" placeholder="Search services or vendors..." aria-label="Search services" />
      <select id="category">
        <option value="all">All categories</option>
      </select>
    </section>

    <section id="services" class="grid" aria-live="polite"></section>
  </main>

  <footer class="site-footer">
    <div class="container">
      <p>Built for our society • <a href="https://github.com/bhartibhanu2896-ops/bhartibhanu2896.github.io">Repository</a></p>
    </div>
  </footer>

  <script src="/assets/script.js"></script>
</body>
</html>
